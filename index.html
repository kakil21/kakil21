<!-- 刮刮乐容器 -->
<div class="scratch-container">
  <!-- 底层：奖品图片 -->
  <!-- 请确保 img/prize.jpg 存在，或者换成网络图片地址 -->
  <img src="img/1.4.jpg" alt="奖品" id="prize-img" class="scratch-image">

  <!-- 顶层：刮奖涂层 -->
  <canvas id="scratch-canvas"></canvas>

  <!-- 重新覆盖按钮：藏在涂层下，刮开该区域后才露出并可点击 -->
  <button id="reset-btn" class="reset-btn">重新覆盖</button>
</div>

<!-- 提示文字 -->
<p class="hint-text">按住鼠标或手指刮开涂层</p>
